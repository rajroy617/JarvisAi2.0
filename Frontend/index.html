<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis</title>
  <link rel="shortcut icon" href="/frontend/assets/img/logo.ico" type="image/x-icon" />

  <!-- Bootsrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <!-- Bootsrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <!-- Particle js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js" type="text/javascript"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/vendore/textillate/animate.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <section id="Oval" class="mb-4">
      <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-10">
          <div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
            <canvas id="canvasOne" width="700" height="420" style="position: absolute;"></canvas>
            <div id="JarvisHood">
              <div class="square">
                <span class="circle"></span>
                <span class="circle"></span>
                <span class="circle"></span>
              </div>
            </div>
          </div>
          <h4 class="text-light text text-center">Ask Me Anything</h4>
          <div class="col-md-12 mt-4 pt-4">
            <div class="text-center">
              <div id="TextInput" class="d-flex">
                <input type="text" id="chatbox" name="chatbox" placeholder="Ask me Anything..." class="input-field">
                <button id="SendBtn" class="glow-on-hover"><i class="bi bi-send"></i></button>
                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas"
                  data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"><i
                    class="bi bi-chat-dots"></i></button>
                <button id="SettingBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-1"></div>
      </div>
    </section>
    <!-- ==================================================
     JARVIS CHAT SIDEBAR
     ================================================== -->

    <div class="offcanvas offcanvas-end jarvis-sidebar" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
      id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">

      <!-- Sidebar Header -->
      <div class="offcanvas-header jarvis-sidebar-header">

        <div>
          <h5 class="offcanvas-title" id="offcanvasScrollingLabel">
            <i class="bi bi-robot"></i> JARVIS
          </h5>

          <small class="jarvis-status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
          </small>
        </div>

        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close">
        </button>

      </div>


      <!-- Sidebar Body -->
      <div class="offcanvas-body jarvis-sidebar-body">

        <div id="chatHistory">
          <!-- Saved chats will appear here -->
        </div>

      </div>


    </div>

  </div>

  </div>

  </div>

  </div>
  <div id="SiriWave" class="mb-4">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
            <div class="">
              <p class="siri-message text-start text-light mb-4">
                Hello Sir, I am your Assistant</p>

              <p class="sender_message text-start text-light mb-2"></p>
              <div id="siri-container">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>


  <script type="text/javascript" src="/eel.js"></script>

  <!--Jquery  -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <!-- Particle js -->
  <script src="script.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>

  <!-- Siri wave -->
  <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

  <!-- Texllate js -->
  <script src="assets/vendore/textillate/jquery.fittext.js"></script>
  <script src="assets/vendore/textillate/jquery.lettering.js"></script>
  <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

  <!-- lottie files -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

  <script src="main.js"></script>
  <script src="controller.js"></script>
</body>

</html>
